services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frammer_backend
    ports:
      - "8000:8000"
    volumes:
      # Persist the DuckDB database — mount a directory, not the file itself
      - duckdb_data:/app/db
      # Persist processed parquets + generated charts
      - ./data:/app/data
      # Persist ChromaDB vector store (used by nlp_frammer)
      - chroma_data:/app/nlp_frammer/data/chroma_db
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENV=production
      # config.py reads DATABASE_PATH from env; override to use the volume path
      - DATABASE_PATH=/app/db/frammer_analytics.duckdb
      - DATA_PATH=/app/data/raw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  duckdb_data:
  chroma_data:
